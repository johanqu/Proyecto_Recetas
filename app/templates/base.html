<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}RecetaAPI{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
        font-family: "Segoe UI", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .navbar {
        background-color: #1a5c38;
        padding: 14px 0;
      }
      .navbar-brand {
        color: white !important;
        font-weight: 700;
        font-size: 1.3rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nav-link {
        color: rgba(255, 255, 255, 0.85) !important;
        font-weight: 500;
        padding-bottom: 4px;
      }
      .nav-link:hover,
      .nav-link.active {
        color: white !important;
        border-bottom: 2px solid white;
      }
      .btn-coleccion {
        border: 2px solid white;
        color: white;
        border-radius: 20px;
        padding: 6px 18px;
        font-weight: 500;
      }
      .btn-coleccion:hover {
        background-color: white;
        color: #1a5c38;
      }
      footer {
        background-color: #1a5c38;
        color: white;
        margin-top: auto;
      }
      .contenido {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="bi bi-egg-fried"></i>
          RecetaAPI
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center gap-3">
            <li class="nav-item">
              <a class="nav-link" href="/">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/explorar">Explorar</a>
            </li>
            <li class="nav-item">
              <a class="btn btn-coleccion" href="/recetas">
                <i class="bi bi-heart me-1"></i>Mi Coleccion
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="contenido">{% block content %}{% endblock %}</div>

    <footer class="py-4">
      <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-egg-fried fs-5"></i>
          <span class="fw-bold">RecetaAPI</span>
        </div>
        <span class="text-white-50"
          >RecetaAPI - Proyecto Final Programacion</span
        >
        <div class="d-flex gap-3 fs-5">
          <a href="#" class="text-white"><i class="bi bi-github"></i></a>
          <a href="#" class="text-white"><i class="bi bi-linkedin"></i></a>
          <a href="#" class="text-white"><i class="bi bi-instagram"></i></a>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
